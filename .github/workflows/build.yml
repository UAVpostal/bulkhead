name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only the newest build matters: a new push cancels any build still waiting.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The ad blocker's large host list is fetched fresh for each build. If this
      # step fails, the build continues and the app uses its small built-in list.
      - name: Fetch ad-block list
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 -o /tmp/hosts.txt https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
          python3 tools/make_blocklist.py /tmp/hosts.txt app/src/main/assets/blocklist.bin
          curl -fsSL --retry 3 -o app/src/main/assets/blocklist-license.txt https://raw.githubusercontent.com/StevenBlack/hosts/master/license.txt || echo "license file not fetched"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Bulkhead.apk

      # Publish it as the "latest" release, which gives a direct APK download
      # link that works from a phone browser. The release is kept and its APK
      # replaced, so the link never goes dead between builds.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest Bulkhead.apk --clobber
            gh release edit latest --notes "Built from ${GITHUB_SHA}"
          else
            gh release create latest Bulkhead.apk --title "Latest build" --notes "Built from ${GITHUB_SHA}"
          fi
