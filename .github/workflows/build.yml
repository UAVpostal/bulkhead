name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Bulkhead.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bulkhead-apk
          path: Bulkhead.apk

      # Also publish it as the "latest" release, which gives a direct APK
      # download link that works from a phone browser.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Bulkhead.apk --title "Latest build" --notes "Built from ${GITHUB_SHA}" --target "${GITHUB_SHA}"
